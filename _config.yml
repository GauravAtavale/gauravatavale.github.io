# Site settings
title: "Gaurav's Blog"
email: your-email@example.com
description: >-
  A space for AI, Machine Learning, and whatever I fancy at the moment.
baseurl: ""
url: "https://gauravatavale.github.io"
webmaster_verifications:
  google: <meta name="google-site-verification" content="0Mn3n4-CrufM_1HHb7FwPH9nUFiK4VXdfbeEvC0jfJo" />

# Author / socials (footer + home portrait pull from these)
author:
  name: Gaurav Atavale
  image: /assets/images/me.jpg
github_username:  gauravatavale
twitter_username: "GauravAtavale"
linkedin_username: "gauravatavale"

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

future: true
show_excerpts: true
permalink: /posts/:year-:month-:day-:title/

# Collections — projects styled with the same card grid as blog
collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      math: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: post
      math: true

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts/
  - README.md
  - README-CHANGES.md
  - CONTENT_WORKFLOW.md
