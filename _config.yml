# Site settings
title: "Gaurav's Blog"
description: "A space for AI, Machine Learning, and whatever I fancy at the moment."
url: "https://gauravatavale.github.io"
baseurl: ""

# Author / footer info — fill in your real handles
author:
  name: Gaurav Atavale
  email: your-email@example.com
  github: gauravatavale     # used to build https://github.com/<github>
  twitter: ""                # used to build https://twitter.com/<twitter> — leave blank to hide
  linkedin: ""                # used to build https://linkedin.com/in/<linkedin> — leave blank to hide
  image: /assets/images/me.jpg # your avatar — add this file, see README-CHANGES.md

# Build settings
future: true
markdown: kramdown
theme: minima

kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  math_engine: mathjax

# Removes .html and categories from post URLs
permalink: /posts/:year-:month-:day-:title/

# Second collection, styled identically to posts, used for the Projects page
collections:
  projects:
    output: true
    permalink: /projects/:path/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - README.md
  - README-CHANGES.md
  - CONTENT_WORKFLOW.md
