---
layout: default
---
{% if page.image %}
<div class="featured-image-container">
  <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="featured-image">
</div>
{% endif %}

<article class="blog-post">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>

  {%- include toc.html -%}

  <div class="post-content">
    {{ content }}
  </div>

  <div class="share-section mt-4">
    <h5 class="share-title">Share this post with your friends!!</h5>
    <div class="share-buttons">
      <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}" class="share-btn" target="_blank" rel="noopener noreferrer"><i class="fab fa-twitter"></i> Twitter</a>
      <a href="https://reddit.com/submit?url={{ page.url | absolute_url | url_encode }}&title={{ page.title | url_encode }}" class="share-btn" target="_blank" rel="noopener noreferrer"><i class="fab fa-reddit"></i> Reddit</a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}" class="share-btn" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i> LinkedIn</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" class="share-btn" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook"></i> Facebook</a>
    </div>
  </div>

  {% if page.comments != false %}
  <div class="comments-section mt-5">
    <h5 class="comments-title mb-4">Comments</h5>
    <script src="https://giscus.app/client.js"
            data-repo="GauravAtavale/gauravatavale.github.io"
            data-repo-id="R_kgDOQGIZYg"
            data-category="Blog Comments"
            data-category-id="DIC_kwDOQGIZYs4CxWPs"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="en"
            crossorigin="anonymous"
            async>
    </script>
  </div>
  <script>
    function setGiscusTheme(theme){var f=document.querySelector('iframe.giscus-frame');if(!f)return;f.contentWindow.postMessage({giscus:{setConfig:{theme:theme}}},'https://giscus.app');}
    new MutationObserver(function(m){m.forEach(function(x){if(x.attributeName==='data-theme'){setGiscusTheme(document.documentElement.getAttribute('data-theme'));}});}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    window.addEventListener('load',function(){setTimeout(function(){setGiscusTheme(document.documentElement.getAttribute('data-theme')||'light');},1000);});
  </script>
  {% endif %}

  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <i class="fas fa-arrow-up"></i>
  </button>
</article>
